version: v2
managed:
  enabled: true
inputs:
  - module: buf.build/recap/arg-services:v1.5.6
# oldest protobuf 7 and grpcio releases to avoid conflicts with other packages (e.g., tensorflow),
# newer runtimes accept older gencode: https://protobuf.dev/support/cross-version-runtime-guarantee
# keep in sync with the lower bounds of the dependencies in pyproject.toml
plugins:
  - remote: buf.build/protocolbuffers/python:v34.0
    out: src
  - remote: buf.build/grpc/python:v1.82.0
    out: src
  - remote: buf.build/community/nipunn1313-mypy:v5.1.0
    out: src
  - remote: buf.build/community/nipunn1313-mypy-grpc:v5.1.0
    out: src

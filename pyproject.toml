[project]
name = "arg-services"
version = "2.0.0"
description = "Protobuf, gRPC, and Connect definitions for microservice-based argumentation machines"
authors = [{ name = "Mirko Lenz", email = "mirko@mirkolenz.com" }]
readme = "README.md"
requires-python = ">=3.12"
# lower bounds match the gencode versions in buf.gen.yaml
dependencies = [
    "googleapis-common-protos>=1,<2",
    "protobuf>=7.34,<8",
    "types-protobuf>=7,<8",
]

[project.optional-dependencies]
grpcio = [
    "grpcio-reflection>=1.82,<2",
    "grpcio>=1.82,<2",
    "types-grpcio>=1,<2",
]
connectrpc = [
    "connectrpc-grpcreflect>=0.1,<0.2",
    "connectrpc>=0.12,<0.13",
    "protobuf-py>=0.6,<0.7",
]

[build-system]
requires = ["uv_build>=0.12,<1"]
build-backend = "uv_build"

[tool.basedpyright]
# generated code, matches .gitignore
exclude = ["src/arg_services/*/"]
